name: Build, Test & Release Integrity

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Run Test Suite
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Solution
        run: dotnet build MDPlus.sln -c Release

      - name: Run Test Suite
        run: dotnet run --project tests\MDPlus.Tests.csproj -c Release

  publish-and-release:
    name: Publish Binaries & Generate Cryptographic SHA-256 Hashes
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Inno Setup
        shell: powershell
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $isccDir = "C:\Program Files (x86)\Inno Setup 6"
            if (-not (Test-Path (Join-Path $isccDir "ISCC.exe"))) {
              choco install innosetup -y --no-progress
            }
            if (Test-Path (Join-Path $isccDir "ISCC.exe")) {
              Add-Content -Path $env:GITHUB_PATH -Value $isccDir
              $env:PATH = "$isccDir;$env:PATH"
            }
          }

      - name: Build, Package & Generate Hashes
        shell: powershell
        run: |
          .\build.ps1 -Action Publish

      - name: Verify Hashes (Integrity Check)
        shell: powershell
        run: |
          .\build.ps1 -Action Verify

      - name: Prepare Release Notes & Checksums
        id: release_notes
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $cleanTag = $tag.TrimStart('v', 'V')
          $notesFile = "docs/RELEASE_NOTES_v${cleanTag}.md"
          if (-not (Test-Path $notesFile)) {
            $notesFile = "docs/RELEASE_NOTES_${tag}.md"
          }

          $notesContent = ""
          if (Test-Path $notesFile) {
            $notesContent = Get-Content $notesFile -Raw
          } elseif (Test-Path "RELEASE_NOTES.md") {
            $notesContent = Get-Content "RELEASE_NOTES.md" -Raw
          } else {
            $notesContent = "# MDPlus Release $tag"
          }

          $checksums = ""
          if (Test-Path "dist\SHA256SUMS.txt") {
            $checksums = Get-Content "dist\SHA256SUMS.txt" -Raw
          }

          $fullBody = @"
$notesContent

---

### 🛡️ Cryptographic SHA-256 Verification Hashes
```
$checksums
```
"@
          [System.IO.File]::WriteAllText("$PWD\release_body.md", $fullBody, [System.Text.Encoding]::UTF8)

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/MDPlus.exe
            dist/MDPlus-Setup.exe
            dist/MDPlus-win-x64.zip
            dist/MDPlus-*-src.zip
            dist/SHA256SUMS.txt
            dist/MDPlus.*.checksums.sha256
            dist/MDPlus.exe.sha256
            dist/MDPlus-Setup.exe.sha256
            dist/MDPlus-win-x64.zip.sha256
            dist/MDPlus-*-src.zip.sha256
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
