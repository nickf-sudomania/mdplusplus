name: Build, Test & Release Integrity

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Run Test Suite
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Solution
        run: dotnet build MDPlus.sln -c Release

      - name: Run Test Suite
        run: dotnet run --project tests\MDPlus.Tests.csproj -c Release

  publish-and-release:
    name: Publish Binaries & Generate Cryptographic SHA-256 Hashes
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Inno Setup
        shell: powershell
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $isccDir = "C:\Program Files (x86)\Inno Setup 6"
            if (-not (Test-Path (Join-Path $isccDir "ISCC.exe"))) {
              choco install innosetup -y --no-progress
            }
            if (Test-Path (Join-Path $isccDir "ISCC.exe")) {
              Add-Content -Path $env:GITHUB_PATH -Value $isccDir
              $env:PATH = "$isccDir;$env:PATH"
            }
          }

      - name: Build, Package & Generate Hashes
        shell: powershell
        run: |
          .\build.ps1 -Action Publish

      - name: Verify Hashes (Integrity Check)
        shell: powershell
        run: |
          .\build.ps1 -Action Verify

      - name: Read Checksums
        id: hashes
        shell: powershell
        run: |
          $checksums = Get-Content dist\SHA256SUMS.txt -Raw
          $checksums = $checksums -replace "`r", ""
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_CHECKSUMS<<EOF"
          Add-Content -Path $env:GITHUB_ENV -Value "$checksums"
          Add-Content -Path $env:GITHUB_ENV -Value "EOF"

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/MDPlus.exe
            dist/MDPlus-Setup.exe
            dist/MDPlus-win-x64.zip
            dist/MDPlus-1.0.0-src.zip
            dist/SHA256SUMS.txt
            dist/MDPlus.1.0.0.checksums.sha256
            dist/MDPlus.exe.sha256
            dist/MDPlus-Setup.exe.sha256
            dist/MDPlus-win-x64.zip.sha256
            dist/MDPlus-1.0.0-src.zip.sha256
          body: |
            ## MDPlus Release

            ### 📦 Official Windows Installer
            Download `MDPlus-Setup.exe` for an effortless automated installation:
            - **Prerequisite Bootstrapper:** Automatically detects if the .NET 8 Windows Desktop Runtime is installed; if missing, automatically downloads and installs it from Microsoft so you never have to hunt for prerequisites.
            - **Shell Integration:** Registers Windows file associations for `.md` and `.markdown` files with "Open with MDPlus" context menu and branded icons.
            - **Shortcuts:** Adds clean Start Menu and optional Desktop shortcuts.
            - **Clean Uninstallation:** Registered in Windows Settings "Installed Apps" / Control Panel.

            ### 🛡️ Cryptographic SHA-256 Verification Digests (Notepad++ Standard)
            To ensure the integrity of your download and verify it has not been tampered with or corrupted, compare the SHA-256 hash using PowerShell or CMD:

            ```powershell
            # In PowerShell:
            Get-FileHash MDPlus-Setup.exe -Algorithm SHA256
            Get-FileHash MDPlus.exe -Algorithm SHA256

            # In Command Prompt (CMD):
            certutil -hashfile MDPlus-Setup.exe SHA256
            certutil -hashfile MDPlus.exe SHA256
            ```

            #### Official SHA-256 Hashes:
            ```
            ${{ env.RELEASE_CHECKSUMS }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
